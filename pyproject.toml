[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cre-expected-loss"
version = "0.1.0"
description = "Development framework for CRE PD, LGD, EAD, scenarios, and expected loss"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "PyYAML>=6,<7",
]

[project.scripts]
cre-el = "cre_expected_loss.cli:main"

[project.optional-dependencies]
development = [
  "jupyterlab>=4,<5",
  "matplotlib>=3.9,<4",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]
modeling = [
  "scikit-learn>=1.5,<2",
  "statsmodels>=0.14,<1",
]
bayesian = [
  "arviz>=0.20,<1",
  "pymc>=5,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cre_expected_loss"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
